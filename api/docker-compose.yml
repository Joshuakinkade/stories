services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT:development
      - PHOTOS_BUCKET=photos
      - AWS_ENDPOINT_URL_S3=http://s3:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=journal
      - AWS_SECRET_ACCESS_KEY=journal-secret
    depends_on:
      db:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  s3:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: journal
      MINIO_ROOT_PASSWORD: journal-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data

  create-bucket:
    image: minio/mc
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 journal journal-secret; do sleep 1; done &&
      mc mb --ignore-existing local/photos
      "

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  s3_data:
